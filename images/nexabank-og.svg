<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Open Graph / Social Share image for NexaBank -->
  <!-- Background -->
  <rect width="1200" height="630" fill="#1a1a2e"/>
  <!-- Decorative circles -->
  <circle cx="980" cy="120" r="280" fill="#0f3460" opacity="0.6"/>
  <circle cx="1100" cy="520" r="180" fill="#16213e" opacity="0.8"/>
  <!-- Logo icon -->
  <rect x="80" y="220" width="100" height="100" rx="18" fill="#f5a623"/>
  <text x="130" y="283" font-family="Arial,sans-serif" font-size="58" font-weight="900" fill="#1a1a2e" text-anchor="middle">N</text>
  <!-- Wordmark -->
  <text x="200" y="275" font-family="Arial,sans-serif" font-size="72" font-weight="900" fill="#ffffff">NexaBank</text>
  <text x="202" y="320" font-family="Arial,sans-serif" font-size="22" font-weight="500" fill="#f5a623" letter-spacing="3">DIGITAL BANKING</text>
  <!-- Tagline -->
  <text x="80" y="410" font-family="Arial,sans-serif" font-size="28" fill="rgba(255,255,255,0.7)">Your trusted digital banking partner</text>
  <!-- Divider -->
  <rect x="80" y="440" width="120" height="4" rx="2" fill="#f5a623"/>
  <!-- AEP badge -->
  <rect x="80" y="520" width="260" height="50" rx="8" fill="rgba(245,166,35,0.15)" stroke="#f5a623" stroke-width="1.5"/>
  <text x="210" y="551" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#f5a623" text-anchor="middle">Adobe Experience Platform Demo</text>
</svg>
